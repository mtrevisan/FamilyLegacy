chronology.location.relationship={0}, relationship [{1}]
citation.note.no_value={0}: no value after the label
citation.note.circa="c. {0}" is read as circa {0}, not as the folio {0}
citation.note.abbreviation_carta="{0}." is read as {1} (carta): it can also be "circa"
citation.note.abbreviation_folio="{0}." is read as {1} (foglio, folio): it can also be a file or a following
citation.note.twice={0} is written twice: the first is kept, "{1}" is left out
