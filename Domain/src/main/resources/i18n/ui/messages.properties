source_kind.advice.cemetery_record=A cemetery record is evidence of death and burial: record the date of death and of burial, the place, the age, and the people buried nearby or named on the stone (spouse, children).
source_kind.advice.census=A census gives age, residence, household and occupation: compare them with what is already known to estimate birth years, follow the residence from one census to the next, and find the other members of the household and the occupation of each one.
source_kind.advice.church_register=A church register records baptisms, marriages and burials: look for the birth and baptism, the marriage and the burial of the people named, and for their parents, godparents and witnesses.
source_kind.advice.civil_registration=A civil record gives the date and place of the event, the parents, the witnesses and the informant: look for the full certificate, and cross-check birth, marriage and death records of the same person.
source_kind.advice.compilation=A compilation is derived from other sources: look for the underlying primary sources (the register or the document it was transcribed from, abstracted or indexed) and record them in Derived from, with the locator.
source_kind.advice.correspondence=Letters tell who knew whom, where and when: note the writer, the recipient, the places, the relations they name and the events they mention, and date the letter if it is undated.
source_kind.advice.court_record=A court record names parties, witnesses and ages, often with residence and occupation: look for guardianships, disputes among relatives and the date and place of each hearing.
source_kind.advice.deed=A deed gives names, residence, occupation and the property: look for the parties and their relation (kinship, neighbours), the witnesses, the place of the property and the date, and for later deeds of the same property.
source_kind.advice.directory=A directory gives residence and occupation at a given year: follow the entries year by year for changes of address and trade, and for the year a name disappears (death or move).
source_kind.advice.immigration=An immigration record gives the place of origin, the date and port of arrival, the age, the destination and the people travelling together: look for the departure record and the family left behind or already there.
source_kind.advice.military_record=A military record gives a service timeline: enlistment, postings, promotions, discharge or pension. Build the military service timeline and take the age, the birthplace, the residence and the description of the person.
source_kind.advice.newspaper=A newspaper may hold births, marriages, deaths, obituaries and local news: look for the relatives named in an obituary, the residence and the occupation, and check the date of the event against the date of the issue.
source_kind.advice.oral=Oral testimony is a lead, not a proof: write down who said it and when, and look for records that confirm each fact (the places, the names and the dates told).
source_kind.advice.school_record=A school record points to education events (enrolment, examinations, graduation), residence evidence and an estimate of the age (class and year). Extract the names, occupation and residence of the parents or guardians.
source_kind.advice.tax_roll=A tax roll shows a person in a place at a given date, with property and tax paid: follow it year by year to see arrival, departure, changes of property and the death of the holder.
source_kind.advice.will_probate=A will or a probate gives heirs and relationships: look for the spouse, the children and the other relatives named, their residences, the date of death (it is at least the date of the will), and the inventory of the estate.
source_kind.title={1}: what to look for in {0}
