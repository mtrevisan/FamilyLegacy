tab.tooltip.relationships=How the record is connected to other records (parents, partners, godparents, members…)
tab.tooltip.research=Conclusions, identity hypotheses and research questions about the record
tab.tooltip.sources=The citations that support the record, with the media that illustrate it
tab.tooltip.stories=Narrative texts about the record, kept apart from the technical notes
tab.tooltip.submitter=Who prepared the file
tab.tooltip.tags=Your own words to classify the record, for what is temporary or cuts across kinds of record
tab.tooltip.completeness=How many individuals have the main data: birth, death, parents, sex
tab.tooltip.distribution=How the individuals are distributed (by century, by sex…)
tab.tooltip.source_coverage=How many individuals and events are backed by a source citation
tab.tooltip.coverage_kinds=How well each kind of record is documented
tab.tooltip.coverage_hotspots=The places where the documentation is thinnest
tab.tooltip.coverage_branches=The branches of the tree, ordered by how well they are documented
tab.tooltip.workspace_citations=The citations of the source and what each one supports
tab.tooltip.workspace_individuals=The individuals documented by the source
tab.tooltip.workspace_families=The families documented by the source
tab.tooltip.workspace_events=The events documented by the source
tab.tooltip.workspace_extracts=The extracts transcribed from the source
tab.tooltip.workspace_media=The media of the source
tab.tooltip.overview=Citations with and without evidence qualifiers
tab.tooltip.source_type=Citations by the type of source (original, derivative, authored)
tab.tooltip.information_type=Citations by the type of information (primary, secondary, undetermined)
tab.tooltip.evidence_type=Citations by the type of evidence (direct, indirect, negative)
tab.tooltip.without_qualifiers=The citations whose evidence has not been assessed yet
tab.tooltip.proof_status=How many conclusions there are for each proof status
tab.tooltip.conclusions=The conclusions recorded; double-click a row to open it
tab.tooltip.unused_sources=Sources that no citation refers to
tab.tooltip.unused_documents=Documents that no source refers to
tab.tooltip.uncited_assertions=Assertions of the file that have no source citation
tab.tooltip.date_point=A single date
tab.tooltip.date_bounded=A date known only to lie within limits: before, after or between
tab.tooltip.date_spanning=A period, from one date to another
tab.tooltip.timeline_person=The life of the person next to the historical events of the places where they lived
tab.tooltip.timeline_comparison=The lifespans of several people side by side
tab.tooltip.assistant_conversion=Converts a date from one calendar to another
tab.tooltip.assistant_liturgical=Finds the date of a feast or movable feast of the liturgical year
tab.tooltip.assistant_sun=Finds sunrise and sunset of a date and place, to read times counted from sunset
tab.tooltip.assistant_relative=Finds a date a given distance before or after another
tab.tooltip.assistant_event=Finds the dates that match an expression relative to an event of the tree
tab.tooltip.assistant_interval=The distance between two dates or events; with a birth, an age
tab.tooltip.assistant_age=Finds the birth date from an age stated at an event
tab.tooltip.assistant_clues=Finds the birth date that agrees with several statements of the age of the same person
tab.tooltip.assistant_verify=Checks that the weekday, the indiction and the date given by a source agree
tab.tooltip.assistant_roman=Reads a Roman date written with Kalends, Nones or Ides

