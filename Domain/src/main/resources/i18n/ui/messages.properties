dialog.tour.progress=Step {0} of {1}
dialog.tour.skip=Skip tour
dialog.tour.step.1.text=<html><body style="width:380px">This short tour shows the first steps to build a family tree: the file, the people, their dates, the sources and the events.<br><br>Nothing is changed while you read it. Press <b>Esc</b> to close it at any time; you can start it again from <b>{0} &gt; {1}</b>.</body></html>
dialog.tour.step.1.title=Welcome to Family Legacy
dialog.tour.step.2.text=<html><body style="width:380px">Everything starts from a file. <b>{0} &gt; {1}</b> creates an empty one (it asks where to keep it); <b>{2}</b> opens an existing one, and <b>{3}</b> brings in data from another program.<br><br>There is no Save: every change is written to the file by itself.</body></html>
dialog.tour.step.2.title=1. Create or open a file
dialog.tour.step.3.text=<html><body style="width:380px"><b>{0} &gt; {1}</b> creates the first person: add a name made of parts (<i>given</i>, <i>family</i>), set the sex and press OK.<br><br>Then select the person in the tree and use <b>{2}</b>, <b>{3}</b> or <b>{4}</b> (also in the right-click menu of the box): the new person is already linked to the selected one.</body></html>
dialog.tour.step.3.title=2. Add the people
dialog.tour.step.4.text=<html><body style="width:380px">A date is not a field of the person: it belongs to an <b>event</b> (a birth, a marriage, a burial). <b>{0} &gt; {1}</b> creates one: choose the type, then type the date in the quick entry box (for example <i>abt 1850</i> or <i>bet 1850 and 1855</i>) and pick the place.</body></html>
dialog.tour.step.4.title=3. Add events and dates
dialog.tour.step.5.text=<html><body style="width:380px">A <b>participation</b> says that a person took part in an event, with a role (for example <i>principal</i> for the person who was born).<br><br>Add the participants in the editor of the event; <b>{0} &gt; {1}</b> lists them all.</body></html>
dialog.tour.step.5.title=4. Say who took part
dialog.tour.step.6.text=<html><body style="width:380px">To say where you read a fact, record the archive or library with <b>{0} &gt; {1}</b>, then the document with <b>{2}</b>, and cite it with <b>{3}</b>: a citation holds the exact place in the document (page, entry).</body></html>
dialog.tour.step.6.title=5. Record repositories, sources and citations
dialog.tour.step.7.text=<html><body style="width:380px">The sidebar on the right shows everything recorded about the selected person. <b>{0} &gt; {1}</b> shows or hides it; the same menu switches between the views of the family.</body></html>
dialog.tour.step.7.title=6. The views and the sidebar
dialog.tour.step.8.text=<html><body style="width:380px">Made a mistake? <b>{0} &gt; {1}</b> (<b>Ctrl+Z</b>) undoes it, <b>{2}</b> brings it back, and <b>{3}</b> lists what changed.</body></html>
dialog.tour.step.8.title=7. Undo anything
dialog.tour.step.9.text=<html><body style="width:380px">The Research Assistant (<b>Ctrl+Shift+A</b>) tells you what is missing or cannot be right as the tree grows, and <b>{0}</b> has the full manual (<b>F1</b>).<br><br>You can repeat this tour any time from <b>{1} &gt; {2}</b>.</body></html>
dialog.tour.step.9.title=Where to go next
dialog.tour.title=Guided Tour
