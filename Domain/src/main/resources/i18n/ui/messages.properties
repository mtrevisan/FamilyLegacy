source_identifier.invalid.title=Check the {1} of {0}
source_identifier.locator_holds_identifier.text=The locator of a repository citation of {0} holds "{1}". A shelf mark, a call number or a film number says where the source is kept: record it as an identifier of the repository citation, and keep in the locator only the position inside the source (the page, the entry, the folio, the frame).
source_identifier.locator_holds_identifier.title=A locator of {0} holds an identifier
source_identifier.missing.text={0} is a {1}: a published work usually has an ISBN (a book), an ISSN (a periodical) or a DOI, and a stable URL. Record the one it has as an identifier of the source, so that it can be told from other editions and found again.
