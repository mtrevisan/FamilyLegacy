enum.identifier.scheme.isbn=ISBN
enum.identifier.scheme.isbn.tooltip=International Standard Book Number (ISBN-10 or ISBN-13): identifies a published edition of a book. The check digit is verified.
enum.identifier.scheme.issn=ISSN
enum.identifier.scheme.issn.tooltip=International Standard Serial Number: identifies a periodical (a journal, a magazine, a newspaper). The check digit is verified.
enum.identifier.scheme.doi=DOI
enum.identifier.scheme.doi.tooltip=Digital Object Identifier (10.xxxx/...): a persistent identifier of an article, a book, a dataset or another digital object.
enum.identifier.scheme.url=URL
enum.identifier.scheme.url.tooltip=Web address of the source (RFC 3986). The syntax is verified.
enum.identifier.scheme.call_number=call number
enum.identifier.scheme.call_number.tooltip=Shelf mark, archival reference or generic call number: where the source is found in the repository.
enum.identifier.scheme.dewey=Dewey
enum.identifier.scheme.dewey.tooltip=Dewey Decimal Classification number of the repository (for example 929.2 ROS).
enum.identifier.scheme.lcc=LCC
enum.identifier.scheme.lcc.tooltip=Library of Congress Classification number of the repository.
enum.identifier.scheme.udc=UDC
enum.identifier.scheme.udc.tooltip=Universal Decimal Classification number of the repository.
enum.identifier.scheme.colon=Colon
enum.identifier.scheme.colon.tooltip=Colon Classification number of the repository.
enum.identifier.scheme.garside=Garside
enum.identifier.scheme.garside.tooltip=Garside Classification number of the repository.
enum.identifier.scheme.fhl_film=FHL film
enum.identifier.scheme.fhl_film.tooltip=FamilySearch (Family History Library) microfilm number: identifies a roll of film, wherever a copy of it is kept.
enum.identifier.scheme.fhl_digital_folder=FHL digital folder
enum.identifier.scheme.fhl_digital_folder.tooltip=FamilySearch digital folder number: identifies a folder of digitized images.
enum.identifier.scheme.fhl_ancestral_file=FHL Ancestral File
enum.identifier.scheme.fhl_ancestral_file.tooltip=FamilySearch Ancestral File identifier.
enum.identifier.scheme.index_card=index card
enum.identifier.scheme.index_card.tooltip=Number or heading of an index card, or of an entry of a card catalog.

enum.context_impact.type.causes=causes
enum.context_impact.type.causes.tooltip=Directly contributes to the occurrence or existence of the target.
enum.context_impact.type.constrains=constrains
enum.context_impact.type.constrains.tooltip=Limits or restricts what was possible or likely (e.g. a law that forbade a marriage).
enum.context_impact.type.explains=explains
enum.context_impact.type.explains.tooltip=Provides context that explains the target, without necessarily having caused it.
enum.context_impact.type.influences=influences
