tooltip.group_network.zoom_fit=Fit the network in the window
tooltip.group_network.zoom_in=Zoom in (also Ctrl + wheel)
tooltip.group_network.zoom_out=Zoom out (also Ctrl + wheel)
tooltip.identity_hypothesis.confidence=How likely you currently think it is that the two records are the same entity. The mere existence of a hypothesis does not imply that they are probably identical.
tooltip.identity_hypothesis.identity.one=First of the two records that may describe the same entity. They must be of the same kind (two individuals, two places, …) and different from each other.
tooltip.identity_hypothesis.identity.two=Second of the two records that may describe the same entity.
tooltip.identity_hypothesis.rationale=Why you think they may be the same (e.g. same parents and parish in both records).
tooltip.identifier.value=The identifier as it is written (the hyphens and the spaces of an ISBN are not a problem). It may not be blank.
tooltip.repository_citation.locator=Where the information is found inside the source: the page, the entry, the folio, the frame. It is not an identifier: the shelf mark, the call number and the classification number of the repository go in the identifiers above.
tooltip.map_2d=Show the 2D map (Ctrl+2)
tooltip.merge.block.remove=Remove this block from the result
tooltip.merge.block.use_source=Take this block from the source
tooltip.merge.block.use_target=Take this block from the target
tooltip.merge.remove_row=Remove this row from the result
tooltip.merge.reset=Back to what the result was when the window opened
tooltip.merge.use_both=Keep both: the target’s and what the target does not already say of the source’s
tooltip.merge.use_source=Replace the result of this row with the source content
tooltip.merge.use_target=Replace the result of this row with the target content
tooltip.merge_different=Record that they are different entities: they will not be proposed for a merge again
tooltip.merge_review=Show the two records side by side and decide the result, before anything is written
tooltip.proof_status=Proof status: {0}
tooltip.report.always_included=Always included in this report
tooltip.report.audit_trail=Add the creation and update comments of each record.
tooltip.report.bold_direct_ancestors=Write in bold the direct ancestors of the person the report is about, wherever they are named (the narrative, the index).
tooltip.report.chronological_timeline=Add a table of the events of the subject, with the related historic events.
tooltip.report.collaterals=Who is included besides the direct line: the spouses, the siblings, the cousins, or everyone connected.
tooltip.report.conflict_confidence=Lists only the conflicts in which at least one of the competing assertions has the confidence you chose (or none stated).
tooltip.report.conflict_filter=Which conflicts the report lists: all of them, only the ones that no conclusion has settled yet, or only the ones a conclusion has settled.
tooltip.report.hypothesis_filter=Which hypotheses the report lists: all of them, the open ones (no conclusion evaluates them, or the evaluation leaves the question open), the accepted ones (a conclusion supports or proves them) or the rejected ones (a conclusion disproves them).
tooltip.report.hypothesis_record_type=Lists only the hypotheses about one kind of record: possible duplicate individuals, places, sources, repositories or other records.
tooltip.report.conflict_record_type=Lists only the conflicts about one kind of record: the events (births, baptisms, deaths, burials), the relationships (parentage), the attributes, the names or the identity hypotheses.
tooltip.report.cover_text=Lines of text under the title on the first page, for example who prepared the report and for whom.
tooltip.report.coverage_report=Add a table of how complete and how sourced each record is.
tooltip.report.cross_references=Where another person of the report is named, write the number of the person in brackets after the name, so that the reader can find the chapter. Needs a numbering.
tooltip.report.cultural_norms=Add the cultural norms that apply to the names and to the approximate dates of the subject.
tooltip.report.date_format=How the dates are written in the report: as recorded (1888-05-01), 1 May 1888, May 1, 1888 or the year only. Only the dates of the Gregorian calendar written in full are changed; a date typed as text, or in another calendar, stays as it is.
tooltip.report.descendants=Add the tree of the descendants of the person.
tooltip.report.direct_relations=List the direct relatives of the person, each with the kinship term and the roles.
tooltip.report.document_header=Add a Document information section with the header of the file, if the file has one.
tooltip.report.download_fonts=Opens the list of the optional components, where the extra fonts can be downloaded into the fonts folder, beside the plugins
tooltip.report.evidence_qualifiers=Under each citation, print the evidence qualifiers that tell how well the source supports the fact.
tooltip.report.footnote=A line of text at the bottom of every page, under the page number.
tooltip.report.full_event_participants=Under each event, list the other participants.
tooltip.report.first_generation=The generation the chapters start from: the subject is generation 0, the parents (or the children) are 1, and so on. The earlier generations are left out of the chapters (the tree still shows them). With the same value as Generations, the report is about that generation only.
tooltip.report.generation_order=The order of the chapters: the generation nearest to the subject first, or the farthest first.
tooltip.report.generations=How many generations to follow from the person (the parents, or the children, are the first); All follows the line to its end.
tooltip.report.given_names=All the given names in full, or the first one in full and the others as initials (Giovanni B. Rossi). The family name is always in full.
tooltip.report.groups_and_memberships=List the groups the person belongs to, in the relationships of the person. In the Family Book, also add a page for each group.
tooltip.report.historic_context_research=Add the historic context and the research tied to the subject: questions, tasks, conclusions and identity hypotheses.
tooltip.report.historic_events=Add the historic events that had an impact on the subject.
tooltip.report.images_per_page=How many images are put on a page of the media section before a new page starts. As it is: the renderer decides.
tooltip.report.include_descriptions=In the Media section, add the location, description and mapping of each item.
tooltip.report.group_sources_by_kind=Group the sources by what they are (census, church register, military record...) instead of one alphabetical list. The sources without a kind come last.
tooltip.report.include_original_sources=In the Sources section, also list the sources that the cited ones are derived from (the register behind a transcription), even if nothing cites them.
tooltip.report.include_pictures=Show the preferred image and the images of the media; with it off, the media are listed as links to their files.
tooltip.report.index_of_individuals=Add an alphabetical index of the individuals in the report (in the Family Book, also an index of the groups).
tooltip.report.index_of_places=Add an alphabetical index of the places in the report.
tooltip.report.index_years=Add the years of birth and death of each person to the index of individuals.
tooltip.report.surname_place_level=The level of the place hierarchy the surnames are grouped by: the place of the birth as it is written (a hamlet, a street), or the municipality, province, region or country that contains it. Where no place of that level is recorded, the place of the birth is used.
tooltip.report.surname_period=How the period of a surname is told: one line from the first to the last year of birth, or one line for each century.
tooltip.report.surname_all_names=Counts the surnames of all the names of an individual (a married woman is also in her maiden name), not only the one of the first name.
tooltip.report.surname_similar=Adds a table of the surnames that may be the same one written in different ways (Masutti, Mazutti), with how many individuals bear each and where.
tooltip.report.indirect_relations=List the spouses and associates of the direct relatives, with the kinship of the relative they hang off.
tooltip.report.introduction=Start with a line saying who the report is about, the lifespan and the number of events, sources and relatives.
tooltip.report.layout=How the pages of the PDF and Word formats are laid out; the other formats ignore it.
tooltip.report.living_privacy=What the report says of the persons who may be living (those with no death, and not born more than 110 years ago): everything about them hidden, only their name and their role in the family, or everything. It has no effect when the privacy policy is Show All.
tooltip.report.long_text_lines=How many lines a text may have to stay inline when the placement is Long ones in a section (a line is about 90 characters).
tooltip.report.margin=The margin of the page, in millimetres; Default is the one of the format.
tooltip.report.maternal_ancestry=List the ancestors on the mother's side of the person.
tooltip.report.max_image_megapixels=An image with more pixels than this (millions) is reduced when the report is made; the file of the image is not changed.
tooltip.report.media=Add the Media section, with the documents of the cited sources and their images.
tooltip.report.media_placement=Where the images and the documents are: in a section of their own after what the persons cite, in the chapter of each person, as an appendix after the indexes, or one on each page.
tooltip.report.notes=Print the notes of each record.
tooltip.report.research_notes=Among the notes, print the research notes (the notes of kind research: reasoning, findings and comments of the research). Off, they are left out and the other notes stay. It needs Notes.
tooltip.report.notes_placement=Where the notes of the events, the attributes and the relationships of a person are written: right after them (inline), in the Notes section of the person, with a reference in the place of the note (always in the section), or in the section only if longer than the number of lines chosen.
tooltip.report.numbering=How the persons of the report are numbered. Automatic uses Ahnentafel (the father of n is 2n, the mother 2n + 1) for the ancestors and d'Aboville (1, 1.1, 1.2, 1.2.1...) for the descendants; Henry (1, 11, 12, 121...) is for the descendants too. A system of the other direction is replaced by the automatic one. The number is written in the heading of the person, in the index and in the tree.
tooltip.report.page_headings=Repeats the title of the report at the top of every page but the first.
tooltip.report.paternal_ancestry=List the ancestors on the father's side of the person.
tooltip.report.person_order=How the persons of the book are put in order: by family name, or by year of birth (whoever has none comes last).
tooltip.report.portrait_alignment=Where the portrait of a person is put in the text: as the format does by default, on the left, centred or on the right, or on the left or on the right with the text flowing around it. Word puts a portrait with the text around it on its side; Markdown and plain text ignore the position.
tooltip.report.portrait_mode=Applies when the preferred image of a person is a region (crop) of a larger photo, such as a group picture. Show the whole photo (the region is only named in the caption), show only the cut-out region, or show the cut-out region and also leave the whole photo out of the Media section.
tooltip.report.portrait_name_title=The caption of the portrait is the name of the person.
tooltip.report.presets=Named sets of the options of this report: choose one to use it again, Save keeps the options as they are now under a name.
tooltip.report.principal_sources_only=Of the sources that cite the same fact, tell only the best ones: original, primary information, direct evidence. A source that contradicts the fact is always told.
tooltip.report.repositories=Add the Repositories section: where the cited sources are kept.
tooltip.report.show_group_attributes=In a group sheet, or in the group pages of the Family Book, list the attributes of the group.
tooltip.report.show_group_members=In a group sheet, or in the group pages of the Family Book, list the members of the group.
tooltip.report.show_privacy_details=Under each record that has a privacy setting, print its level, reason and expiry.
tooltip.report.show_subgroups=In a group sheet, or in the group pages of the Family Book, list the groups that the group belongs to and contains.
tooltip.report.source_locator=Tell the page, the folio or the other locator of the source in the citation.
tooltip.report.sources=Print the source citations of each record, and the Sources section.
tooltip.report.stories=The stories (the notes of kind story: narrative prose meant to be read) are chosen apart from the notes, and are written as a text with its title, not as a note. Left out; inline, right after the narrative of the person (or after what they belong to); or in a Stories section at the end of the chapter of the person.
tooltip.report.sources_placement=Where the text a source says (the extract, its note and crop) is written: with the citation (inline), in the Citations section of the person, with a number in the citation (always in the section), or in the section only if longer than the number of lines chosen.
tooltip.report.thumbnail_size=The longest side of the portrait of a person in the chapter, in pixels (the portrait is reduced, never enlarged).
