source_identifier.repository_without_identifier.text=The citation of {1} says where {0} is kept but not how to find it there. Record the call number, the shelf mark or the classification number (Dewey, LCC, ...) as an identifier of the citation. The page, the entry or the folio is the locator.
source_identifier.repository_without_identifier.title=How to find {0} in {1}
source_identifier.scheme_mismatch.repository.text=The identifier "{3}" of the repository citation of {0} is recorded as {1}, but it looks like {2}. If it identifies the source itself and not where it is kept in the repository, move it to the identifiers of the source with the right scheme.
source_identifier.scheme_mismatch.text=The identifier "{3}" of {0} is recorded as {1}, but it looks like {2}. Change its scheme if it is one, so that it can be checked and compared with the other sources.
source_identifier.scheme_mismatch.title=The identifier of {0} looks like {2}
