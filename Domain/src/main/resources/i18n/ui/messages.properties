tooltip.merge.reset=Back to what the result was when the window opened
tooltip.merge.use_both=Keep both: the target’s and what the target does not already say of the source’s
tooltip.merge.use_source=Replace the result of this row with the source content
tooltip.merge.use_target=Replace the result of this row with the target content
tooltip.merge_different=Record that they are different entities: they will not be proposed for a merge again
tooltip.merge_review=Show the two records side by side and decide the result, before anything is written
