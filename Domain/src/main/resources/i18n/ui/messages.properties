context.hint.historic.territory=A change of borders may explain why the same place appears under two states, or in two registers.
context.hint.historic.war=A war may explain a death far from home, a conscription, a displacement or a gap in the records.
context.hint.norm.adoption=A custom of adoption may explain a child recorded in a family that is not their birth family.
context.hint.norm.baptism=The custom of the age of baptism or confirmation may help to estimate a date of birth from a ceremony.
context.hint.norm.burial=A burial custom may explain where and when the burial took place after the death.
context.hint.norm.inheritance=An inheritance rule may explain who inherited, and why a will, a guardianship or a move followed a death.
context.hint.norm.legitimacy=A rule on legitimacy may explain how the birth was recorded and what name or rights the child had.
context.hint.norm.marriage=A marriage custom may explain who married whom, when and with what property.
context.hint.norm.marriage_age=A minimum age of marriage limits when the marriage could be: it can help to estimate a birth year.
context.hint.norm.military=The age of military service may help to estimate a birth year from a muster roll.
context.hint.norm.naming=A naming custom may explain the name given to a child, and help to guess the names of ancestors.
