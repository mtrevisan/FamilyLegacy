source_identifier.film.text=Look the film number up in the FamilySearch Catalog (search by film or fiche number): it gives the title, the places and the years the film covers, and whether the images can be viewed online, at a family history center or only in the Family History Library. Record the frame (image) number you used in the locator of the citation, not in the identifier.
source_identifier.film.title=FHL film {1} of {0}
