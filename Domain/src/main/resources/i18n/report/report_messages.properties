HYPOTHESES_NOTES=A hypothesis has no state of its own: it is open when no conclusion evaluates it or the evaluation leaves the question open (conflicting evidence, no proof status), accepted when the most recent conclusion that evaluates it supports or proves it (the records are still to be merged: merging deletes the hypothesis), rejected when that conclusion disproves it. The report only lists the hypotheses, it never decides them.
