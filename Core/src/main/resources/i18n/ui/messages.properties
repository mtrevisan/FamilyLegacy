# ======================================================================
# Tooltips: when to use a record, and what the non-obvious fields mean
# ======================================================================

# --- when to use a record (first tab of the dialog, and type list of the record selection) ---
record.usage.conclusion=Use it when your sources disagree (for example two different birth dates) and you have weighed them: it records which assertion you judge to be the right one, how well proven it is and why. It never alters or deletes the records it evaluates; they all stay in the file, so the reasoning remains auditable.
record.usage.identity_hypothesis=Use it when two records could describe the same real-world entity (two individuals, two places, …) and you want to track the possibility, without merging yet. It states nothing about how likely the match is beyond its confidence. Evaluate it with a Conclusion; accept it by performing the merge, after which the hypothesis is deleted.
record.usage.cultural_norm=Use it to document a custom, law or practice of a time and place (age of majority, naming convention, inheritance rule, …) that helps interpret records or estimate missing data, e.g. a birth year from the age at which a ceremony was normally held. Link it to what it explains with a Context Impact.
record.usage.historic_event=Use it for a broad event that shaped many lives (a war, an epidemic, a border change, …). It is not an event of a person: to say that someone took part in something, use an Event with participations. Link it to what it explains with a Context Impact.
record.usage.context_impact=Use it to document that a cultural norm or historic event explains, influences, constrains, motivates or causes something about a person, group, place, event, relationship or conclusion. It is an interpretation, not proof that the target took part in the context: say why in the explanation.
record.usage.research_question=Use it to state what you want to find out (e.g. "Who were the parents of Giovanni?") about a person, family, event, place or record. Activities and tasks are linked to the question, and a Conclusion can say how it was answered.
record.usage.research_activity=Use it to log one piece of research work, performed or planned: a search of an archive, the review of a document, a letter to a parish. It records the work (and what it found, including nothing), not a genealogical fact. Facts go in the records, evaluated with Conclusions.
record.usage.research_task=Use it for a to-do item that follows from your research (e.g. "Check the 1871 census for the family"). When it is done, note the outcome and complete it.
record.usage.event_participation=Use it to say that an individual or group took part in an event, and in which role. The same event can have several participants (the principal of a birth, the witnesses of a marriage).
record.usage.relationship=Use it to say how two individuals or groups are related (parent and child, partners, godparent, …). Parentage asserted by different sources can be resolved with a Conclusion.
record.usage.individual_attribute=Use it for a characteristic or status of an individual that is not an event: occupation, residence, title, nationality, number of children, … When it started or ended is told by its dates.
record.usage.group_attribute=Use it for a characteristic or status of a group (a family, a parish, a confraternity, …) that is not an event.
record.usage.place_relationship=Use it to say how two places are related, typically that one is part of the other (a village in a municipality, a municipality in a province), possibly only for a period.

# --- confidence (every field with confidence) ---
enum.confidence.tooltip=How sure you are that the assertion is true, judged from the citations that support it. It expresses your current estimate and may change as evidence is added.
enum.confidence.low.tooltip=Limited evidence, unresolved conflicts, or speculative.
enum.confidence.medium.tooltip=The evidence generally supports it, but gaps or uncertainties remain.
enum.confidence.high.tooltip=The evidence strongly supports it and no significant unresolved conflict is known.

# --- proof status (conclusion) ---
enum.proof_status.tooltip=How well the issue is established, according to the Genealogical Proof Standard.
enum.proof_status.unresearched.tooltip=Nothing has been researched yet on this issue.
enum.proof_status.conflicting_evidence.tooltip=The evidence is conflicting and none prevails: the issue stays open.
enum.proof_status.supported.tooltip=A preponderance of the evidence supports the preferred assertion, but without absolute certainty.
enum.proof_status.proven.tooltip=Proven according to the Genealogical Proof Standard: a reasonably exhaustive search, complete citations, sound analysis, conflicts resolved, and a soundly reasoned conclusion.
enum.proof_status.disproven.tooltip=Proven false. Normally at least two assertions are resolved and no preferred one is set.

tooltip.conclusion.issue=The specific question this conclusion settles: an event type, or a topic such as "birth_date", "marriage_place", "parentage", "death_cause", "relationship_type".
tooltip.conclusion.proof_status=How well the issue is established. Hover over the values for their meaning.
tooltip.conclusion.narrative=Explain your reasoning: the sources you evaluated, how you compared them and why you chose this conclusion. This is what makes the conclusion auditable.
tooltip.conclusion.resolves=The competing assertions or hypotheses (records) that this conclusion evaluates, at least two when the proof status is "disproven". They are not modified or deleted: all of them stay in the file.
tooltip.conclusion.preferred=The assertion (preferred assertion) you judge most likely to be correct. It must be one of the resolved records. Leave it empty when the conclusion is purely negative ("none of the hypotheses is valid"), as with disproven. Consumers needing a single value choose the preferred one of the strongest applicable conclusion.

# --- identity hypothesis ---
tooltip.identity_hypothesis.identity.one=First of the two records that may describe the same entity. They must be of the same kind (two individuals, two places, …) and different from each other.
tooltip.identity_hypothesis.identity.two=Second of the two records that may describe the same entity.
tooltip.identity_hypothesis.rationale=Why you think they may be the same (e.g. same parents and parish in both records).
tooltip.identity_hypothesis.confidence=How likely you currently think it is that the two records are the same entity. The mere existence of a hypothesis does not imply that they are probably identical.

# --- cultural norm ---
tooltip.cultural_norm.title=A short name for the rule, e.g. "Napoleonic Code age of majority".
tooltip.cultural_norm.rule_type=The broad category of the rule. The details and parameters (ages, degrees, …) go in the notes and citations. Hover over the values for their meaning.
tooltip.valid_from=The date from which the norm was in effect.
tooltip.valid_to=The date until which the norm was in effect.
tooltip.cultural_norm.confidence=How sure you are that this norm was really in effect at that time and place.

enum.cultural_norm.rule_type.age_of_majority.tooltip=The age at which a person became legally an adult.
enum.cultural_norm.rule_type.marriage_minimum_age.tooltip=The minimum age to marry, civilly or religiously.
enum.cultural_norm.rule_type.baptism_age.tooltip=The age (or delay from birth) at which baptism was customarily administered. Useful to estimate a birth from a baptism.
enum.cultural_norm.rule_type.confirmation_age.tooltip=The age at which confirmation was customarily received (e.g. 12 years old).
enum.cultural_norm.rule_type.military_service_age.tooltip=The age at which military service started or ended, or the age of conscription.
enum.cultural_norm.rule_type.retirement_age.tooltip=The age at which one customarily or legally retired.
enum.cultural_norm.rule_type.naming_convention.tooltip=How names were given (e.g. a child named after a grandparent, Latin names in the nominative).
enum.cultural_norm.rule_type.surname_transmission.tooltip=How the surname was passed on (from the father, from the mother, changed on marriage, …).
enum.cultural_norm.rule_type.patronymic_system.tooltip=Names derived from the father's name (e.g. Johansson, Ivanovich).
enum.cultural_norm.rule_type.matronymic_system.tooltip=Names derived from the mother's name.
enum.cultural_norm.rule_type.title_usage.tooltip=How titles and honorifics were used and who was entitled to them.
enum.cultural_norm.rule_type.inheritance_rule.tooltip=Who inherited what: primogeniture, equal division among the children, rights of daughters and widows, …
enum.cultural_norm.rule_type.succession_rule.tooltip=Who succeeded to a title, an office or a throne.
enum.cultural_norm.rule_type.dowry_practice.tooltip=Customs about the dowry or bride price.
enum.cultural_norm.rule_type.guardianship_rule.tooltip=Who became the guardian of an orphan or of a minor.
enum.cultural_norm.rule_type.adoption_practice.tooltip=How and why adoptions were made (including informal ones).
enum.cultural_norm.rule_type.marriage_practice.tooltip=Customs about marrying: banns, season, witnesses, who consented, …
enum.cultural_norm.rule_type.marriage_prohibited_degree.tooltip=The degrees of kinship within which marriage was forbidden, or required a dispensation.
enum.cultural_norm.rule_type.widowhood_rule.tooltip=The status and rights of widows and widowers, and the customs about remarriage.
enum.cultural_norm.rule_type.residence_pattern.tooltip=Where a couple settled after marrying (with the groom's family, with the bride's, on their own).
enum.cultural_norm.rule_type.household_structure.tooltip=How households were composed (nuclear, extended, with servants or lodgers).
enum.cultural_norm.rule_type.social_classification.tooltip=How society was divided into classes, estates or castes.
enum.cultural_norm.rule_type.religious_practice.tooltip=Religious customs that leave records (feast days, sacraments, …).
enum.cultural_norm.rule_type.burial_practice.tooltip=Where and when the dead were buried, and what was recorded about it.
enum.cultural_norm.rule_type.citizenship_rule.tooltip=How citizenship or nationality was acquired or lost.
enum.cultural_norm.rule_type.legitimacy_rule.tooltip=When a child was considered legitimate and how it could be legitimated.
enum.cultural_norm.rule_type.age_difference_convention.tooltip=The usual age difference between spouses, or between parents and children, used to estimate missing dates.
enum.cultural_norm.rule_type.generational_interval.tooltip=The typical span between generations, used to estimate missing dates.

# --- context impact ---
tooltip.context_impact.context=The cultural norm or historic event that exerts the influence. It is context: it is not evidence that the target took part in it or followed it.
tooltip.context_impact.target=What is affected: an individual, group, place, event, relationship, attribute, conclusion, participation, … Prefer the most specific record.
tooltip.context_impact.impact_type=How the context acts on the target. Historic events commonly explain, influence, motivate or cause; cultural norms commonly explain, influence or constrain. Hover over the values for their meaning.
tooltip.context_impact.explanation=Explain how and why the context affects the target. This is an interpretation: the reasoning is what makes it useful.
tooltip.context_impact.confidence=How sure you are that the context really had this effect on the target.

enum.context_impact.type.explains.tooltip=Provides context that explains the target, without necessarily having caused it.
enum.context_impact.type.influences.tooltip=Exerts a general influence on the target.
enum.context_impact.type.constrains.tooltip=Limits or restricts what was possible or likely (e.g. a law that forbade a marriage).
enum.context_impact.type.motivates.tooltip=Encourages or makes the target more likely (e.g. a famine that pushed a family to emigrate).
enum.context_impact.type.causes.tooltip=Directly contributes to the occurrence or existence of the target.

# --- research activity ---
tooltip.research_activity.type=What kind of work this was. Hover over the values for their meaning.
tooltip.research_activity.status=Whether the work is planned, under way, done or dropped.
tooltip.research_activity.action=Describe the work done or planned, e.g. "Searched the baptism index of St. Mary's parish, 1820-1830".
tooltip.research_activity.target=The person, family, event, place or record being investigated.
tooltip.research_activity.search_scope=How much of the source you looked at. It matters for negative results: failing to find something in an index only is not the same as failing to find it in the whole source. Mostly used for searches and reviews.
tooltip.research_activity.search_scope.type=How much of the source was examined. Hover over the values for their meaning.
tooltip.research_activity.search_scope.detail=Which pages, years, volumes or entries were covered.
tooltip.research_activity.result=What the work led to. Hover over the values for their meaning.
tooltip.research_activity.observation=What you objectively saw, without interpreting it (transcriptions, counts, the absence of an entry).
tooltip.research_activity.conclusion=The interpretation you draw from the observations. Keep it apart from the observations: the facts are asserted in the records, evaluated with Conclusions.
tooltip.research_activity.confidence=How sure you are of the interpretation produced by this activity.
tooltip.research_activity.parent=The previous activity from which this one originated (e.g. the search that found the document now being reviewed).
tooltip.research_activity.follow_up=Tasks to start when this activity is completed, whoever created them.

enum.research_activity.type.search.tooltip=Searched a repository, index, catalog or collection.
enum.research_activity.type.review.tooltip=Examined a specific source or record.
enum.research_activity.type.analysis.tooltip=Analyzed evidence or correlated pieces of information.
enum.research_activity.type.correspondence.tooltip=Exchanged messages with archives, institutions or people.
enum.research_activity.type.interview.tooltip=Interviewed a person.
enum.research_activity.type.hypothesis.tooltip=Formulated or refined a research hypothesis.

enum.research_activity.search_scope.entire_source.tooltip=The complete source was reviewed.
enum.research_activity.search_scope.index_only.tooltip=Only the index was examined: entries missing from the index may still be in the source.
enum.research_activity.search_scope.partial_source.tooltip=A limited portion of the source was examined (say which in the detail).
enum.research_activity.search_scope.selected_entries.tooltip=Only specific entries were reviewed.

enum.research_activity.result.positive.tooltip=Relevant information was found.
enum.research_activity.result.negative.tooltip=The search was completed and found nothing relevant (a negative result: record how much of the source was covered).
enum.research_activity.result.inconclusive.tooltip=Something was found, but it does not answer the question.
enum.research_activity.result.conflicting.tooltip=What was found conflicts with other evidence: a Conclusion may resolve it.
enum.research_activity.result.unavailable.tooltip=The source was inaccessible, unreadable, lost, …

# --- research question and task ---
tooltip.research_question.confidence=How sure you are of the conclusion you reached about this question.
tooltip.research_question.rationale=Why you reached this conclusion, or why the question is still open.
tooltip.research_task.priority=How urgent the task is for your research.
tooltip.research_task.outcome=What came out of the task once completed.

# --- evidence qualifiers ---
enum.evidence.source_type.original.tooltip=The first recording of the information (e.g. the parish register itself).
enum.evidence.source_type.derived.tooltip=A copy, transcription, abstract, index, … of an original.
enum.evidence.information_type.primary.tooltip=The informant had first-hand knowledge (e.g. the father giving the birth date of his child).
enum.evidence.information_type.secondary.tooltip=The informant had second-hand knowledge (e.g. someone reporting a birth he did not witness).
enum.evidence.information_type.undetermined.tooltip=It is not known who the informant was or how they knew.
enum.evidence.evidence_type.direct.tooltip=The information states the assertion outright.
enum.evidence.evidence_type.indirect.tooltip=The information implies the assertion, but does not state it (e.g. an age at death implying a birth year).
enum.evidence.evidence_type.negative.tooltip=The assertion is inferred from an absence (e.g. no entry where one would be expected).

# --- research task and activity status, historic event type ---
enum.research_task.status.tooltip=Where the task stands.
enum.research_task.status.open.tooltip=Not yet started.
enum.research_task.status.in_progress.tooltip=Currently being worked on.
enum.research_task.status.completed.tooltip=Successfully completed: note the result in the outcome.
enum.research_task.status.abandoned.tooltip=Intentionally discontinued (say why in the outcome, so it is not repeated by mistake).
enum.research_task.priority.low.tooltip=Can wait; do it when convenient.
enum.research_task.priority.normal.tooltip=To be done in the normal course of the research.
enum.research_task.priority.high.tooltip=To be done first: other work depends on it, or the opportunity may be lost (e.g. an archive closing).
enum.research_activity.status.tooltip=Whether the work is planned, under way, done or dropped.
enum.research_activity.status.planned.tooltip=Not started yet: it is a plan, so it has no result.
enum.research_activity.status.in_progress.tooltip=Started but not finished.
enum.research_activity.status.completed.tooltip=Done: record the result, the observations and the sources consulted.
enum.research_activity.status.abandoned.tooltip=Dropped before completion (e.g. the archive is inaccessible); say why in the observation.
enum.historic_event.type.tooltip=The kind of event. It is a broad event that shaped many lives, not an event of one person.
enum.historic_event.type.war.tooltip=Armed conflict: it explains conscription, deaths, displacement, missing records.
enum.historic_event.type.epidemic.tooltip=A disease outbreak limited to a region or a period: it explains clusters of deaths, or of burials in the same weeks.
enum.historic_event.type.famine.tooltip=A widespread food shortage: it explains deaths, emigration and fewer births.
enum.historic_event.type.migration.tooltip=A large movement of people, forced or voluntary: it explains why a family appears or disappears from a place.
enum.historic_event.type.legal_reform.tooltip=A change in the law (civil registration, inheritance, citizenship, …): it explains changes in the records themselves or in the rules applied.
enum.historic_event.type.political_change.tooltip=A change of regime, government or ruler: it explains changes in the administration, the language or the jurisdiction of the records.
enum.historic_event.type.territorial_change.tooltip=A change of borders or of the authority over a place (annexation, partition, …): it explains why records are held by a different archive or in another language.
enum.historic_event.type.natural_disaster.tooltip=Flood, earthquake, fire, eruption, …: it explains deaths, relocations and lost records.
enum.historic_event.type.economic_crisis.tooltip=A depression, a crash or a collapse of a local trade: it explains emigration, changes of occupation and later marriages.
enum.historic_event.type.scientific_discovery.tooltip=A discovery or an invention that changed life or work (vaccines, railways, …).
enum.historic_event.type.religious_reform.tooltip=A change in the religion or in its rules (schisms, new rites, secularization): it explains changes in the parish records and in the customs.
enum.historic_event.type.social_movement.tooltip=A collective movement (revolt, strike, emancipation, …): it explains changes in the status, the occupation or the residence of people.
enum.historic_event.type.pandemic.tooltip=A disease outbreak spread over several regions or countries at once (as opposed to a local epidemic).

