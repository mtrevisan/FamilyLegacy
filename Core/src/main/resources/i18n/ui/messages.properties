chronology.death_before_birth.title=Death before birth: {0}
chronology.death_before_birth.explanation=The death of {0} ({1}) is before the birth ({2}) whatever the exact days: the two dates cannot both be right.
chronology.implausible_lifespan.title=Implausible lifespan: {0}
chronology.implausible_lifespan.explanation={0} would have lived at least {1} years (born {3}, died {4}), more than the {2} years taken as the longest plausible life. Check the dates or whether two people were merged.
chronology.event_before_birth.title=Event before birth: {0}
chronology.event_before_birth.explanation=The event {1} of {0} is dated {2}, before the birth ({3}) whatever the exact days.
chronology.marriage_before_birth.title=Marriage before birth: {0}
chronology.marriage_before_birth.explanation=The event {1} of {0} is dated {2}, before the birth ({3}) whatever the exact days.
chronology.event_after_death.title=Event after death: {0}
chronology.event_after_death.explanation=The event {1} of {0} is dated {2}, after the death ({3}) whatever the exact days. Posthumous events (burial, probate, honors, ...) are not reported.
chronology.child_before_parent.title=Child born before the parent: {0}
chronology.child_before_parent.explanation={0} (born {2}) is a biological child of {1} (born {3}), but the birth of the child is before the birth of the parent whatever the exact days.
chronology.parent_too_young.title=Parent too young: {0}
chronology.parent_too_young.explanation={0} (born {3}) was younger than {2} years, the youngest plausible age for a parent, when {1} was born ({4}). The limit is a convention: it can be a wrong date or an exception.
chronology.parent_too_old.title=Parent too old: {0}
chronology.parent_too_old.explanation={0} (born {3}) was older than {2} years when {1} was born ({4}), the oldest plausible age for a biological parent. The limit is a convention: it can be a wrong date or an exception.
chronology.born_after_mother_death.title=Child born after the death of the mother: {0}
chronology.born_after_mother_death.explanation={0} was born {2}, after the death of the mother {1} ({3}) whatever the exact days.
chronology.born_after_father_death.title=Child born after the death of the father: {0}
chronology.born_after_father_death.explanation={0} was born {3}, more than {2} days after the death of the father {1} ({4}), the longest time a child can be born after the death of the father.
chronology.union_before_birth.title=Union before birth: {0}
chronology.union_before_birth.explanation=A union of {0} begins {1}, before the birth ({2}) whatever the exact days.
chronology.union_after_death.title=Union after death: {0}
chronology.union_after_death.explanation=A union of {0} begins {1}, after the death ({2}) whatever the exact days.
chronology.overlapping_marriages.title=Overlapping marriages: {0}
chronology.overlapping_marriages.explanation={0} is married to {1} and to {2} in the same period. It is not necessarily an error (polygamy, a missing end date), but it is worth checking.
conclusion.suggest.none=No assertion is better supported than the others: examine the sources.
conclusion.suggest.preferred=Candidate for the preferred assertion: {0} (confidence {1}, {2} sources); judge it against the sources before choosing.
conclusion.suggest.draft=A ConclusionRecord can resolve it: it lists the records of the finding as RESOLVES, states the proof status and explains the reasoning. The assertions stay as they are.
conclusion.conflicting_events.title=Conflicting {1} dates: {0}
conclusion.conflicting_events.explanation={0} has {2} {1} events whose dates cannot all be right ({3}). {4}
conclusion.multiple_events.title=Several {1} events: {0}
conclusion.multiple_events.explanation={0} has {2} {1} events ({3}). Their dates agree, so they can corroborate each other or be duplicates, but an individual has only one. {4}
conclusion.too_many_parents.title=More than two biological parents: {0}
conclusion.too_many_parents.explanation={0} is the biological child of {1} individuals ({2}), and no ConclusionRecord evaluates the competing links.
conclusion.same_sex_parents.title=Two biological {1}: {0}
conclusion.same_sex_parents.explanation={0} has two biological {1} ({2}): one of the links is probably wrong, or the sex of a parent is.
conclusion.conflicting_relationships.title=Conflicting relationships: {0} and {1}
conclusion.conflicting_relationships.explanation={0} is linked to {1} with relationships that exclude each other ({2}).
conclusion.own_ancestor.title=Own ancestor: {0}
conclusion.own_ancestor.explanation={0} would be their own ancestor through the relationships of descent among: {1}. At least one of them is wrong.
